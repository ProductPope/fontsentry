name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # requires-python is ">=3.12": test the floor and the newest supported release.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      # Overrides the .python-version pin for uv sync / uv run.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The UI's API types are generated from web/openapi.json (itself pinned to
      # the backend by tests/test_openapi.py); fail if they weren't regenerated.
      - name: API types match openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api-schema.d.ts

      - name: Accessibility lint (jsx-a11y)
        run: npm run lint

      - name: Unit tests + coverage floor
        run: npm run test:coverage

      - name: Build (tsc + vite)
        run: npm run build
